<!doctype html>

<html lang="en">
  <body style="margin: 0px">
    <script type="module">
      import init, { run } from "./dist/interactive_background.js";

      const onAppLoaded = () => {
        const loadingText = document.getElementById("loading-text");
        const canvas = document.getElementById("renderer");

        loadingText.style.display = "none";
        canvas.style.display = "block";
      };

      init()
        .then(() => {
          run("renderer", onAppLoaded);
        })
        .catch((err) => {
          if (err.message.startsWith("Using exceptions for control flow")) {
            return;
          }

          throw err;
        });
    </script>

    <p id="loading-text">Canvas loading</p>
    <canvas style="display: none" id="renderer"></canvas>
  </body>
</html>
